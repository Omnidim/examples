name: Documentation links

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --verbose --no-progress --exclude '^http://localhost:3000/' README.md CONTRIBUTING.md SUPPORT.md custom-api/README.md mcp/README.md outbound-calls/README.md web-voice/README.md webhooks/README.md
