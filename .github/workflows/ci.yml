name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [web-voice, custom-api/typescript, webhooks/typescript, outbound-calls/typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: ${{ matrix.directory }}
      - run: npm run check
        working-directory: ${{ matrix.directory }}
      - run: npm test
        working-directory: ${{ matrix.directory }}

  python:
    name: Python examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [custom-api/python, webhooks/python, outbound-calls/python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover
        working-directory: ${{ matrix.directory }}

  go:
    name: Go examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [custom-api/go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v6
        with:
          go-version: "1.27"
      - run: go test ./...
        working-directory: ${{ matrix.directory }}