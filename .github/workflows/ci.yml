name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript examples
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [web-voice, custom-api/typescript, webhooks/typescript, outbound-calls/typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
        working-directory: ${{ matrix.directory }}
      - run: npm run check
        working-directory: ${{ matrix.directory }}
      - run: npm test
        working-directory: ${{ matrix.directory }}

  python:
    name: Python examples
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [custom-api/python, webhooks/python, outbound-calls/python]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover
        working-directory: ${{ matrix.directory }}
