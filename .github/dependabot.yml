version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/web-voice"
      - "/custom-api/typescript"
      - "/webhooks/typescript"
      - "/outbound-calls/typescript"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # CI runs Node 22: a newer @types/node major would type APIs the runtime lacks.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/outbound-calls/python"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR for all actions, so paired actions (codeql init and analyze) move together.
    groups:
      actions:
        patterns: ["*"]
